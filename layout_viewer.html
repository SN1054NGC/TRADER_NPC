<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DayZ Layout Viewer / Builder</title>
<style>
:root{
 --bg:#12121a; --pan:#1c1c27; --pan2:#262634; --line:#3a3a4d;
 --txt:#e3e5ec; --mut:#9496aa; --acc:#5aa7ff; --ok:#73e6a0; --warn:#ffb0b8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:12px/1.45 'Segoe UI',system-ui,sans-serif;overflow:hidden}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--pan)}
header b{font-size:13px;color:var(--acc)}
header label{color:var(--mut)}
main{display:grid;grid-template-columns:290px 1fr 330px;height:calc(100vh - 44px)}
aside{overflow:auto;padding:8px 10px;background:var(--pan)}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
section#stagewrap{overflow:auto;padding:14px;background:
 repeating-conic-gradient(#16161f 0% 25%, #1b1b24 0% 50%) 50% / 24px 24px}
h3{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
input,select,textarea,button{background:#15151f;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:11px;font-family:inherit}
input[type=number]{width:100%}
input[type=color]{padding:0;height:20px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
.row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;margin:3px 0}
.row label{color:var(--mut);font-size:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px}
.chk{display:flex;align-items:center;gap:5px;margin:2px 0;color:var(--mut)}
.chk input{width:auto}
#screen{position:relative;transform-origin:0 0;background:#0b0b10;box-shadow:0 16px 60px #000a;outline:1px solid var(--line)}
.w{position:absolute;box-sizing:border-box}
.tree{font-size:11px;white-space:nowrap}
.tree div{cursor:pointer;padding:1px 4px;border-radius:3px}
.tree div:hover{background:#2a2a3e}
.tree div.sel{background:#1d3a61;outline:1px solid var(--acc)}
.tag{color:var(--mut);font-size:10px}
pre{white-space:pre-wrap;font:11px/1.4 ui-monospace,Consolas,monospace;background:#0a0a10;border:1px solid var(--line);border-radius:5px;padding:6px;max-height:230px;overflow:auto;color:#d5dcff}
.hint{color:var(--mut);font-size:10px;margin:4px 0}
.pill{display:inline-block;background:var(--pan2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:10px;color:var(--mut);margin-right:4px}
.pill.acc{color:var(--acc);border-color:#2c4a75}
#status{color:var(--mut);font-size:10px;margin-left:auto}
.drop{outline:2px dashed var(--acc);outline-offset:-6px}
</style>
</head>
<body>
<header>
 <b>DayZ Layout Viewer</b>
 <button id="btnOpen">Открыть .layout</button>
 <input id="file" type="file" accept=".layout,.txt" style="display:none">
 <label>встроенный:</label>
 <select id="builtin"></select>
 <label>экран:</label>
 <select id="res">
  <option value="1280x720">1280x720</option>
  <option value="1600x900">1600x900</option>
  <option value="1920x1080" selected>1920x1080</option>
  <option value="2560x1440">2560x1440</option>
  <option value="3840x2160">3840x2160</option>
 </select>
 <label>масштаб</label>
 <input id="zoom" type="range" min="10" max="150" value="45" style="width:110px">
 <span id="zoomv" class="pill">45%</span>
 <button id="btnFit">Вписать</button>
 <label class="chk"><input id="cbGrid" type="checkbox"> сетка</label>
 <label class="chk"><input id="cbOutline" type="checkbox" checked> рамки</label>
 <label class="chk"><input id="cbNames" type="checkbox"> имена</label>
 <label class="chk"><input id="cbHidden" type="checkbox"> показать visible 0</label>
 <label class="chk"><input id="cbLoc" type="checkbox" checked> локализация</label>
 <label class="chk"><input id="cbDrag" type="checkbox" checked> таскать мышью</label>
 <span id="status">загрузите .layout</span>
</header>
<main>
 <aside id="left">
  <h3>Дерево виджетов</h3>
  <div class="hint">клик — выбрать, стрелки — сдвиг (Shift = x10)</div>
  <div id="tree" class="tree"></div>
 </aside>
 <section id="stagewrap"><div id="screen"></div></section>
 <aside id="right">
  <h3>Выбранный виджет</h3>
  <div id="selinfo" class="hint">ничего не выбрано</div>
  <div id="props"></div>
  <h3>Изменения (патч)</h3>
  <div class="hint">меняется только значение свойства в его строке; комментарии и формат файла сохраняются</div>
  <div class="g2" style="margin-bottom:4px">
   <button id="btnPatch">Показать патч</button>
   <button id="btnRevert">Отменить всё</button>
  </div>
  <pre id="patch">—</pre>
  <div class="g2">
   <button id="btnCopy">Скопировать файл</button>
   <button id="btnDl">Скачать .layout</button>
  </div>
 </aside>
</main>

}

}

  var i=document.createElement('input'); i.type='number'; i.min=0; i.max=(ch==='a'?1:255); i.step=(ch==='a'?'0.01':'1');
  i.value=(ch==='a')?col.a:col[ch];
  i.oninput=function(){ var c={r:col.r,g:col.g,b:col.b,a:col.a}; c[ch]=parseFloat(this.value); setProp(n,'color',fmt(c.r/255)+' '+fmt(c.g/255)+' '+fmt(c.b/255)+' '+fmt(c.a)); render(); };
  cr.appendChild(i);
 });
 box.appendChild(document.createTextNode('color r g b a'));
 box.appendChild(cr);

 if(kindOf(n.cls)==='text'||kindOf(n.cls)==='richtext'||kindOf(n.cls)==='multitext'||kindOf(n.cls)==='button'||kindOf(n.cls)==='combo'||kindOf(n.cls)==='list'){
  var row=document.createElement('div'); row.className='row';
  var l=document.createElement('label'); l.textContent='text';
  var i=document.createElement('input'); i.type='text'; i.value=String(n.props.text||'');
  i.oninput=function(){ setProp(n,'text',this.value); render(); };
  row.appendChild(l); row.appendChild(i); box.appendChild(row);
  numRow('text px', function(){return fontPx(n);}, function(v){ setProp(n,'exact text size',String(Math.round(v))); }, '1');
  selRow('t-halign','text halign',['left','center','right']);
  selRow('t-valign','text valign',['top','center','bottom']);
  var d=document.createElement('label'); d.className='chk';
  var w=document.createElement('input'); w.type='checkbox'; w.checked=isOne(n,'wrap');
  w.onchange=function(){ setProp(n,'wrap',this.checked?'1':'0'); render(); };
  d.appendChild(w); d.appendChild(document.createTextNode('wrap')); box.appendChild(d);
 }
 if(kindOf(n.cls)==='progress'){
  numRow('maximum', function(){return parseFloat(n.props.maximum||100);}, function(v){ setProp(n,'maximum',fmt(v)); }, '1');
  numRow('Progress', function(){return parseFloat(n.props.Progress||0);}, function(v){ setProp(n,'Progress',fmt(v)); }, '1');
  var dv=document.createElement('label'); dv.className='chk';
  var iv=document.createElement('input'); iv.type='checkbox'; iv.checked=isOne(n,'vertical');
  iv.onchange=function(){ setProp(n,'vertical',this.checked?'1':'0'); render(); };
  dv.appendChild(iv); dv.appendChild(document.createTextNode('vertical')); box.appendChild(dv);
 }
 if(kindOf(n.cls)==='slider'){
  numRow('maximum', function(){return parseFloat(n.props.maximum||1);}, function(v){ setProp(n,'maximum',fmt(v)); }, '1');
  numRow('current', function(){return parseFloat(n.props.current||0);}, function(v){ setProp(n,'current',fmt(v)); }, '1');
  numRow('step', function(){return parseFloat(n.props.step||1);}, function(v){ setProp(n,'step',fmt(v)); }, '0.05');
 }

 box.appendChild(document.createTextNode('все свойства виджета'));
 var pre=document.createElement('pre');
 var s='';
 for(var k in n.props){ s += k+' = '+n.props[k]+'\n'; }
 pre.textContent=s; box.appendChild(pre);

 elProps.appendChild(box);
}

// ============================ patch / export ============================
function buildPatched(){
 var lines=state.lines.slice();
 var inserts={};
 for(var dk in state.dirty){
  var d=state.dirty[dk]; var node=d.node, key=d.key;
  var meta=node.propMeta[key];
  var val=String(node.props[key]);
  var needQuote=/\s/.test(val) && !/^-?[0-9.]/.test(val);
  var txt=needQuote?('"'+val+'"'):val;
  if(meta && meta.line!==undefined){
   lines[meta.line]=meta.indent+(meta.rawKey||key)+' '+txt;
  } else {
   var ins=inserts[node.openLine]=inserts[node.openLine]||[];
   ins.push(node.indent+' '+key+' '+txt);
  }
 }
 var out=[];
 for(var i=0;i<lines.length;i++){
  out.push(lines[i]);
  if(inserts[i]) out=out.concat(inserts[i]);
 }
 return out.join('\n');
}
function showPatch(){
 var changed=[];
 for(var dk in state.dirty){
  var d=state.dirty[dk];
  changed.push('// '+d.node.name+'\n'+d.key+' '+d.node.props[d.key]);
 }
 elPatch.textContent = changed.length ? changed.join('\n') : '— нет изменений —';
}
document.getElementById('btnPatch').onclick=showPatch;
document.getElementById('btnRevert').onclick=function(){ loadText(state.src,state.srcName); };
document.getElementById('btnCopy').onclick=function(){
 var t=buildPatched();
 navigator.clipboard.writeText(t).then(function(){ setStatus('файл скопирован в буфер ('+t.length+' симв.)'); },
  function(){ setStatus('не удалось скопировать — используйте Скачать .layout'); });
};
document.getElementById('btnDl').onclick=function(){
 var t=buildPatched();
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));
 a.download=state.srcName||'layout.layout';
 a.click();
};

// ============================ toolbar ============================
var selBuiltin=document.getElementById('builtin');
Object.keys(BUILTIN).forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=k; selBuiltin.appendChild(o); });
selBuiltin.onchange=function(){ loadText(BUILTIN[this.value],this.value); };
document.getElementById('btnOpen').onclick=function(){ document.getElementById('file').click(); };
document.getElementById('file').onchange=function(){
 var f=this.files[0]; if(!f)return;
 var rd=new FileReader();
 rd.onload=function(){ loadText(String(rd.result),f.name); };
 rd.readAsText(f,'utf-8');
};
document.getElementById('res').onchange=function(){ render(); buildProps(); };
document.getElementById('zoom').oninput=function(){ state.zoom=parseInt(this.value,10)/100; document.getElementById('zoomv').textContent=this.value+'%'; render(); };
document.getElementById('btnFit').onclick=function(){
 var sz=screenSize(); var wrap=document.getElementById('stagewrap');
 var z=Math.min((wrap.clientWidth-40)/sz.w,(wrap.clientHeight-40)/sz.h);
 state.zoom=Math.max(0.05,z); document.getElementById('zoom').value=Math.round(state.zoom*100);
 document.getElementById('zoomv').textContent=Math.round(state.zoom*100)+'%'; render();
};
document.getElementById('cbGrid').onchange=function(){ state.grid=this.checked; render(); };
document.getElementById('cbOutline').onchange=function(){ state.outline=this.checked; render(); };
document.getElementById('cbNames').onchange=function(){ state.names=this.checked; render(); };
document.getElementById('cbHidden').onchange=function(){ state.hidden=this.checked; render(); };
document.getElementById('cbLoc').onchange=function(){ state.loc=this.checked; render(); };
document.getElementById('cbDrag').onchange=function(){ state.drag=this.checked; render(); };
elScreen.onclick=function(){ select(null); };

document.addEventListener('keydown',function(e){
 if(!state.sel)return;
 var step=e.shiftKey?10:1;
 var dx=0,dy=0;
 if(e.key==='ArrowLeft')dx=-step; else if(e.key==='ArrowRight')dx=step;
 else if(e.key==='ArrowUp')dy=-step; else if(e.key==='ArrowDown')dy=step;
 else return;
 e.preventDefault();
 var n=state.sel, sz=screenSize();
 var sx=isOne(n,'hexactpos')?1:sz.w/100, sy=isOne(n,'vexactpos')?1:sz.h/100;
 var x=pnum(n,'position',0,0)+dx*sx, y=pnum(n,'position',1,0)+dy*sy;
 setProp(n,'position',fmt(x)+' '+fmt(y)); render(); buildProps();
});
document.addEventListener('dragover',function(e){ e.preventDefault(); document.body.classList.add('drop'); });
document.addEventListener('dragleave',function(){ document.body.classList.remove('drop'); });
document.addEventListener('drop',function(e){
 e.preventDefault(); document.body.classList.remove('drop');
 var f=e.dataTransfer.files[0]; if(!f)return;
 var rd=new FileReader(); rd.onload=function(){ loadText(String(rd.result),f.name); }; rd.readAsText(f,'utf-8');
});

// ============================ boot ============================
(function(){
 var first=Object.keys(BUILTIN)[0];
 if(first){ selBuiltin.value=first; loadText(BUILTIN[first],first); document.getElementById('btnFit').click(); }
 else setStatus('выберите .layout');
})();
</script>
